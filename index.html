<!DOCTYPE html>
<html lang="en-US">

<head>
    <meta charset="utf-8" />
    <title>Your first HTML form</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <form id="webForm">
        <ul>
            <li>
                <label for="name">Name:</label>
                <input type="text" id="name" name="user_name" placeholder="Name here" />
            </li>
            <li>
                <label for="mail">E-mail:</label>
                <input type="email" id="mail" name="user_mail" placeholder="name@example.com" />
            </li>
            <li>
                <label for="Mobile No">Mobile No:</label>
                <input type="tel" id="num" name="user_mobile" placeholder="Mobile No" />
            </li>
            <li>
                <label for="msg">Message:</label>
                <textarea id="msg" name="user_message" placeholder="Type your message here"></textarea>
            </li>
            <li class="button">
                <button type="submit">Send your message</button>
            </li>
        </ul>
    </form>
    <script src="script.js"></script>
</body>

</html>
